# clauses.yaml — библиотека пунктов спецификации
# Используется build_contract_clauses(deal) в src/contracts/clauses.py
#
# DSL applies_when — Python-выражения, доступны:
#   foundation_scope:    "none" | "customer_builds" | "contractor_full"
#                      | "contractor_with_materials" | "rama"
#   installation_scope:  "none" | "full" | "shefmontazh"
#   verification_scope:  "none" | "supplier" | "customer"
#   has_orion:           bool
#   orion_poles_scope:   "none" | "by_customer" | "by_contractor"
#   winter_concrete:     bool
#   winter_surcharge:    bool
#
# Параметры в text (jinja {{ }}):
#   foundation_term_days_by_customer  — срок устройства фундамента Заказчиком (int)
#   scales_or_with_orion              — "Весы" или "Весы и комплект ПАК «ОРИОН»"
#   install_site_label                — "фундаменту" или "месту установки"
#   obligations_range                 — "7-11" и т.п., вычисляется автонумерацией
#   delivery_address_text             — адрес поставки
#   winter_surcharge_amount           — сумма зимнего удорожания

sections:
  - id: obligations_supplier
    title: "Обязательства Подрядчика"
    section_number: 4
  - id: obligations_customer
    title: "Обязательства Заказчика"
    section_number: 5
  - id: special_conditions
    title: "Особые условия"
    section_number: 6
  - id: final
    title: "Заключительные положения"
    section_number: 7

clauses:

  # ============================================================
  # ОБЯЗАТЕЛЬСТВА ПОДРЯДЧИКА
  # ============================================================

  - id: supplier_prepares_docs
    section: obligations_supplier
    order: 10
    applies_when: 'verification_scope == "supplier"'
    text: |
      Подрядчик обеспечивает подготовку комплекта документации, в т.ч. Паспорта/РЭ на Весы к моменту проведения поверки Весов.

  - id: supplier_dispatches_construction_team
    section: obligations_supplier
    order: 20
    applies_when: 'foundation_scope in ("contractor_full", "contractor_with_materials") and not (has_orion and orion_poles_scope == "by_contractor")'
    text: |
      Подрядчик направляет строительную бригаду для выполнения работ по строительству фундамента Весов (Приложение №2 к настоящей Спецификации) в течение 10 (десяти) рабочих дней с момента поступления предоплаты в соответствии с п.2.1 настоящей Спецификации, по предварительному письменному согласованию Сторон.

  - id: supplier_dispatches_construction_team_with_orion_poles
    section: obligations_supplier
    order: 20
    applies_when: 'foundation_scope in ("contractor_full", "contractor_with_materials") and has_orion and orion_poles_scope == "by_contractor"'
    text: |
      Подрядчик направляет строительную бригаду для выполнения работ по строительству фундамента Весов и установке опор и кабель-трасс для программно-аппаратного комплекса «ОРИОН» (Приложение №1 и №2 к настоящей Спецификации) в течение 10 (десяти) рабочих дней с момента поступления предоплаты в соответствии с п.2.1 настоящей Спецификации, по предварительному письменному согласованию Сторон.

  - id: winter_foundation_surcharge
    section: obligations_supplier
    order: 30
    applies_when: 'winter_surcharge == true and foundation_scope in ("contractor_full", "contractor_with_materials")'
    text: |
      В случае выполнения бетонных работ в зимний период при среднесуточной температуре окружающего воздуха +5 °С и ниже стоимость работ по строительству фундамента весов увеличивается на {{ winter_surcharge_amount }} рублей, в т.ч. НДС 22%. Факт необходимости применения «зимних» работ подтверждается письменным уведомлением Подрядчика, направленным Заказчику, с приложением данных о среднесуточной температуре с официального метеорологического ресурса (gismeteo.ru и т.д) за период производства бетонных работ.

  - id: winter_foundation_surcharge_payment
    section: obligations_supplier
    order: 40
    applies_when: 'winter_surcharge == true and foundation_scope in ("contractor_full", "contractor_with_materials")'
    text: |
      Увеличенная стоимость работ по строительству фундамента подлежит оплате Заказчиком в срок и на условиях, предусмотренных п.2.2 настоящей Спецификации. В Акте выполненных работ по строительству фундамента фиксируется факт выполнения работ в зимних условиях.

  - id: winter_concrete_heating_option
    section: obligations_supplier
    order: 50
    applies_when: 'winter_surcharge == true and foundation_scope in ("contractor_full", "contractor_with_materials")'
    text: |
      При отрицательных температурах срок набора прочности бетона значительно увеличивается. Для ускорения Подрядчик дополнительно может применять технологию обогрева бетона. Оборудование для обогрева (греющие кабели, шкаф управления обогревом и пр.) не входит в стоимость работ и предоставляется Подрядчиком за отдельную плату.

  # ============================================================
  # ОБЯЗАТЕЛЬСТВА ЗАКАЗЧИКА
  # ============================================================

  - id: customer_unable_to_accept_team_delays_work
    section: obligations_customer
    order: 5
    applies_when: 'installation_scope != "none"'
    text: |
      В случае, если Заказчик письменно не подтверждает готовность принять монтажную бригаду Подрядчика для выполнения работ по монтажу Весов, в сроки, указанные в п.3 настоящей Спецификации, срок исполнения работ, указанный в настоящей Спецификации, сдвигается пропорционально сроку начала работ.

  - id: customer_builds_foundation_per_spec
    section: obligations_customer
    order: 10
    applies_when: 'foundation_scope == "customer_builds"'
    text: |
      Заказчик обязуется изготовить фундамент своими силами по строительному заданию Подрядчика (Приложение №1 к настоящей Спецификации) в течение {{ foundation_term_days_by_customer }} рабочих дней с момента подписания настоящей Спецификации.

  - id: customer_provides_foundation_photos
    section: obligations_customer
    order: 20
    applies_when: 'foundation_scope == "customer_builds"'
    text: |
      Заказчик предоставляет Подрядчику согласно контрольному листу (Приложение №2 к настоящей Спецификации) фотографии фундамента с разных ракурсов (общий вид, вид на закладные, вид на пандусы) и фактические размеры (в миллиметрах) готового фундамента (расстояния между закладными по двум осям, абсолютные высотные отметки каждой закладной, уголков (по нивелиру)) в соответствии с размерами, указанными в Строительном задании на фундамент Весов. В случае обнаружения Подрядчиком несоответствий фактических размеров фундамента со строительным заданием, Заказчик самостоятельно устраняет замечания и высылает новые данные Подрядчику. Выезд на монтаж Весов производится только после согласования фундамента Весов с Подрядчиком, при наличии замечаний к фундаменту сроки монтажа откладываются до устранения замечаний.

  - id: customer_provides_flat_area_for_rama
    section: obligations_customer
    order: 10
    applies_when: 'foundation_scope == "rama"'
    text: |
      Заказчик для установки рамы и Весов предоставляет твёрдую (асфальт, бетон или дорожные плиты) горизонтальную площадку размером не менее 30х4м. Допустимые перепады по высоте – не более 50 мм по всей длине площадки. Допустимый уклон не более 1:500.

  - id: customer_provides_flat_area_for_construction
    section: obligations_customer
    order: 10
    applies_when: 'foundation_scope in ("contractor_full", "contractor_with_materials")'
    text: |
      Заказчик обязуется подготовить ровную площадку (перепад высот не более 10 см на площадку 35м) для изготовления монолитного фундамента Весов, свободную от инженерных коммуникаций, несущая способность грунта – не менее 2 кг/см². В случае перепада высот более 10 см на площадке дополнительные затраты на строительство фундамента оплачиваются по дополнительному соглашению.

  - id: customer_provides_construction_materials
    section: obligations_customer
    order: 25
    applies_when: 'foundation_scope == "contractor_with_materials"'
    text: |
      Заказчик обязан предоставить материалы и спецтехнику для строительства фундамента Весов, указанные в Приложении №3 к настоящей Спецификации, в течение 2-х дней с момента начала выполнения работ. Материалы, поставляемые Заказчиком, должны быть новыми, т.е. вновь изготовленными (которые не были в употреблении, в ремонте, в консервации, в том числе которые не были восстановлены, у которых не были осуществлены замены составных частей, не были восстановлены потребительские свойства), не должны являться выставочными образцами, должны быть свободными от прав третьих лиц, в целом готовыми к установке, эксплуатации и использованию по назначению.

  - id: customer_sends_pre_install_photos
    section: obligations_customer
    order: 25
    applies_when: 'installation_scope == "shefmontazh"'
    text: |
      Заказчик до выезда специалиста шеф-монтажа направляет в адрес Подрядчика фотографии площадки/фундамента/места установки с разных ракурсов. В случае обнаружения Подрядчиком несоответствий фактических размеров с требуемыми для монтажа Весов, Заказчик самостоятельно устраняет замечания и высылает новые данные Подрядчику. Выезд на монтаж Весов производится только после согласования площадки (места установки) Весов с Подрядчиком, при наличии замечаний сроки шеф-монтажа откладываются до устранения замечаний.

  - id: customer_provides_scales_near_install_site
    section: obligations_customer
    order: 30
    applies_when: 'installation_scope != "none"'
    text: |
      Заказчик предоставляет {{ scales_or_with_orion }} на Объект Работ, в непосредственной близости к {{ install_site_label }} не далее 5 (пяти) метров, к моменту приезда специалистов Подрядчика для выполнения Работ.

  - id: customer_provides_crane
    section: obligations_customer
    order: 40
    applies_when: 'installation_scope != "none"'
    text: |
      Заказчик предоставляет в период проведения Работ автокран грузоподъёмностью не менее 16 тонн с телескопической стрелой, с оператором (крановщиком) и комплектом грузозахватных приспособлений.

  - id: customer_provides_test_vehicle
    section: obligations_customer
    order: 50
    applies_when: 'verification_scope == "supplier"'
    text: |
      Заказчик предоставляет для настройки Весов короткобазный автомобиль или погрузчик массой не менее 8т перед калибровкой и поверкой Весов. Заказчик предоставляет при необходимости в качестве балласта груженые автомашины массой близкой к max Весов для проведения поверки метрологической службой.

  - id: customer_provides_power_220V
    section: obligations_customer
    order: 60
    applies_when: 'has_orion or foundation_scope == "rama"'
    text: |
      Заказчик выполняет работы по подводке напряжения питания 220В. Выполненные работы должны соответствовать требованиям ПУЭ.

  - id: customer_organizes_specialist_logistics
    section: obligations_customer
    order: 65
    applies_when: 'installation_scope == "shefmontazh"'
    text: |
      Заказчик организовывает доставку специалиста Подрядчика из аэропорта на объект выполнения Работ (туда и обратно) и предоставляет жильё на время проведения шеф-монтажных работ.

  - id: customer_does_install_under_supervision
    section: obligations_customer
    order: 70
    applies_when: 'installation_scope == "shefmontazh"'
    text: |
      Заказчик выполняет монтаж и пуско-наладку Весов своими силами под контролем специалиста Подрядчика (механическая и электротехническая часть).

  - id: customer_provides_tools_and_specialists
    section: obligations_customer
    order: 80
    applies_when: 'installation_scope == "shefmontazh"'
    text: |
      Для выполнения монтажа Весов у Заказчика должны быть все необходимые инструменты:
      - Домкраты 5, 10 т – 3-4 шт.;
      - Ключи на «36»;
      - Нивелир современный с рейкой и штативом;
      - Рулетка 5 м;
      - Набор ключей 8...22 мм;
      - Сварочный аппарат;
      - УШМ (болгарка);
      - Молотки различные;
      - Лом – 2 шт.

      Для проведения работ со стороны Заказчика требуются следующие квалифицированные специалисты:
      - Сварщик – 1 чел.;
      - Слесарь, монтажник КИПиА – 2 чел.;
      - Прораб – 1 чел.

  - id: customer_organizes_verification
    section: obligations_customer
    order: 90
    applies_when: 'verification_scope == "customer"'
    text: |
      Вызов поверителя с доставкой гирь класса М1 по ГОСТ 7328-2001 для проведения первичной поверки Весов планирует и оплачивает Заказчик.

  - id: customer_prepares_orion_poles
    section: obligations_customer
    order: 100
    applies_when: 'has_orion and orion_poles_scope == "by_customer"'
    text: |
      Заказчик подготавливает опоры для монтажа оборудования (видеокамеры, светофоры, датчики позиционирования, информационные табло и шкаф автоматики) согласно схеме размещения оборудования ПАК «ОРИОН» (Приложение №3 к настоящей Спецификации). Опоры – основные требования к несущим столбам: труба 80х80 мм, высота 3 м (опоры светофоров, IP-камер и информационных табло); труба диаметром 40 мм, высота 1 м от уровня платформы (опоры для датчиков положения).

  - id: customer_prepares_cable_routes
    section: obligations_customer
    order: 110
    applies_when: 'has_orion and orion_poles_scope == "by_customer"'
    text: |
      Заказчик подготавливает кабельные трассы для оборудования по согласованию с Подрядчиком. Необходимо предоставить Подрядчику фото кабельных трасс.

  - id: customer_installs_high_cameras_supervised
    section: obligations_customer
    order: 120
    applies_when: 'has_orion'
    text: |
      В случае установки видеокамер и прокладки кабеля на высоте свыше 2 м, Заказчик устанавливает видеокамеры и прокладывает кабель под руководством Подрядчика.

  - id: customer_provides_pc_for_orion
    section: obligations_customer
    order: 130
    applies_when: 'has_orion'
    text: |
      Заказчик предоставляет ПК с согласованными системными требованиями (Приложение №4 к настоящей Спецификации).

  # ============================================================
  # ОСОБЫЕ УСЛОВИЯ
  # ============================================================

  - id: additional_work_during_construction
    section: special_conditions
    order: 10
    applies_when: 'foundation_scope in ("contractor_full", "contractor_with_materials")'
    text: |
      При строительстве фундамента Весов в случае возникновения необходимых дополнительных работ (демонтаж скрытых в земле конструкций/сетей, откачка грунтовых вод из приямка и т.д.), которые изначально было невозможно оценить, выполняются Заказчиком или Подрядчиком за дополнительную плату, которая согласовывается и оплачивается отдельно. Сроки проведения работ при согласовании и проведении дополнительных работ также сдвигаются на время их согласования и выполнения.

  - id: orion_oversized_vehicle
    section: special_conditions
    order: 40
    applies_when: 'has_orion'
    text: |
      В случае, когда взвешиваемый автомобиль имеет габаритную длину, превышающую длину платформы Весов, потребуются установка и подключение дополнительных датчиков положения автомобиля, которые не включены в стоимость ПАК «ОРИОН» и оплачиваются отдельно.

  # ============================================================
  # ЗАКЛЮЧИТЕЛЬНЫЕ
  # ============================================================

  - id: cross_reference_to_contract
    section: final
    order: 10
    applies_when: 'true'
    text: |
      В случае, если в ходе выполнения Работ возникнут обстоятельства, нарушающие условия п.п. {{ obligations_range }} настоящей Спецификации, по ним применяются п.п. 3.2-3.4 Договора.

  - id: delivery_address
    section: final
    order: 20
    applies_when: 'true'
    text: |
      Адрес поставки Весов и выполнения Работ по настоящей Спецификации: {{ delivery_address_text }}.
