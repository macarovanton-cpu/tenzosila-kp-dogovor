[theme]
base = "light"
primaryColor = "#015198"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#1A1A1A"
borderColor = "#E0E4E8"
linkColor = "#015198"

redColor = "#D04514"
orangeColor = "#EF7F1A"

font = "PT Sans:https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&display=swap"
headingFont = "PT Sans Narrow:https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@700&display=swap"

baseRadius = "6px"
buttonRadius = "6px"
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#F5F7FA"
borderColor = "#E0E4E8"
